name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version from package.json's "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter web lint
      - run: pnpm test
      - run: pnpm build
      # Fails when a logo file wasn't regenerated after docs/brand/glaze-logo.svg changed.
      - run: pnpm brand --check
      # Fails when packages/schemas/src/generated doesn't match Glance's source
      # plus packages/schemas/overrides.ts (downloads the Glance tag's tarball).
      - run: pnpm schemas --check

  docker:
    name: Docker image (amd64) + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: glaze:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: sh docker/smoke-test.sh glaze:smoke
