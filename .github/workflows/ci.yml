name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version from package.json's "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter web lint
      # Glance v0.8.7 for the integration test: every widget fixture and every
      # new widget must pass `glance config:validate` (apps/server/test/glance-integration.test.ts).
      - name: Cache Glance
        id: glance
        uses: actions/cache@v4
        with:
          path: .cache/glance
          key: glance-v0.8.7-linux-amd64
      - name: Download Glance
        if: steps.glance.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/glance
          curl -fsSL https://github.com/glanceapp/glance/releases/download/v0.8.7/glance-linux-amd64.tar.gz | tar -xz -C .cache/glance
          test -x .cache/glance/glance
      - run: pnpm test
        env:
          GLANCE_BIN: ${{ github.workspace }}/.cache/glance/glance
      - run: pnpm build
      # Fails when a logo file wasn't regenerated after docs/brand/glaze-logo.svg changed.
      - run: pnpm brand --check
      # Fails when packages/schemas/src/generated doesn't match Glance's source
      # plus packages/schemas/overrides.ts (downloads the Glance tag's tarball).
      - run: pnpm schemas --check

  docker:
    name: Docker image (amd64) + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: glaze:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: sh docker/smoke-test.sh glaze:smoke
