# Glance + Glaze sharing one config folder. Copy next to your config:
#
#   .
#   ├─ compose.yml      (this file)
#   └─ config/
#      ├─ glance.yml    (with server.assets-path: /app/assets)
#      └─ assets/       (custom.css, design.js, …)
#
# Create the password hash once:
#   docker run --rm -it ghcr.io/klingesean/glaze:latest hash-password
# and paste it below. Since v0.1.1 it contains no $ signs, so it needs no
# quotes or escaping. (A v0.1.0 hash with $ signs must be regenerated.)

services:
  glance:
    image: glanceapp/glance:v0.8.7
    restart: unless-stopped
    volumes:
      # Glance reads /app/config/glance.yml ...
      - ./config:/app/config
      # ... and serves this folder as /assets/ (server.assets-path: /app/assets).
      - ./config/assets:/app/assets
    ports:
      - "8080:8080"

  glaze:
    image: ghcr.io/klingesean/glaze:latest
    restart: unless-stopped
    # Glaze runs as uid 1000. If ./config belongs to another user, either
    # `chown -R 1000:1000 ./config`, or run Glaze as that user here:
    # user: "1000:1000"
    volumes:
      # Mount the folder, not the single file: Glaze writes a temp file next
      # to glance.yml and renames it, and keeps its secret in .glaze/.
      - ./config:/config
    ports:
      - "8090:8090"
    environment:
      # Fake example; replace it with the output of hash-password.
      GLAZE_ADMIN_PASSWORD_HASH: scrypt:32768:8:1:FAKEsaltReplaceMe0000w:FAKEhashRunHashPasswordAndPasteYourOwn00000
      # Where Glaze finds the files Glance serves as /assets/ (here: ./config/assets).
      GLAZE_ASSETS_PATH: /config/assets
      # Where your *browser* reaches Glance, for the live preview.
      GLANCE_URL: http://localhost:8080
      # Behind a reverse proxy or Cloudflare Tunnel:
      # GLAZE_TRUST_PROXY: "true"
